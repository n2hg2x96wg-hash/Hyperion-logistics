<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperion Logistics - Advanced Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tracker/tracker.css">
  <link rel="stylesheet" href="ui/motion.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }

    nav {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      padding: 20px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-size: 20px; font-weight: 700; color: #3b82f6; }
    .nav-links { display: flex; list-style: none; gap: 32px; }
    .nav-links a { color: #e2e8f0; text-decoration: none; }
    .nav-links a:hover { color: #3b82f6; }

    .hero {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p { font-size: 18px; color: #94a3b8; margin-bottom: 40px; }

    .search-group {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .search-group input {
      flex: 1;
      min-width: 250px;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 16px;
    }

    .btn-search {
      padding: 12px 32px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-search:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .results {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    .result-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .map-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      overflow: hidden;
      height: 400px;
      margin-top: 24px;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 16px;
    }

    .info-item {
      padding: 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
    }

    .info-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .info-value { color: #e2e8f0; font-size: 16px; font-weight: 600; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      padding: 32px 24px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 16px; }
      .search-group { flex-direction: column; }
      .btn-search { width: 100%; }
      .map-card { height: 350px; }
    }

    /* Status colour variants */
    .status.pending, .status.status-pending { background: rgba(251,146,60,0.1); color: #fb923c; }
    .status.delivered, .status.status-delivered { background: rgba(34,197,94,0.1); color: #22c55e; }
    .status.in-transit, .status.status-in-transit { background: rgba(59,130,246,0.1); color: #3b82f6; }
    .status.on-hold, .status.status-on-hold { background: rgba(239,68,68,0.1); color: #ef4444; }
    .status.status-under-custom-review { background: rgba(251,146,60,0.1); color: #fb923c; }

    /* ETA card */
    .eta-card {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-top: 20px;
    }
    .eta-label {
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .eta-date {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }

    /* Refresh button */
    .btn-refresh {
      padding: 8px 16px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 8px;
      color: #3b82f6;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-refresh:hover { background: rgba(59,130,246,0.3); }

    /* Skeleton loading */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .skeleton-card {
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(148,163,184,0.1);
      border-radius: 12px;
      padding: 24px;
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(30,41,59,0.8) 25%, rgba(51,65,85,0.8) 50%, rgba(30,41,59,0.8) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    .skeleton-badge { height: 28px; width: 120px; margin-bottom: 12px; }
    .skeleton-title { height: 24px; width: 200px; margin-bottom: 16px; }
    .skeleton-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .skeleton-item { height: 60px; }

    /* Map pulse animation */
    @keyframes mapPulse {
      0%   { box-shadow: 0 0 0 0   rgba(59,130,246,0.7); }
      70%  { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
      100% { box-shadow: 0 0 0 0   rgba(59,130,246,0); }
    }
  </style>

</head>
<body>
  <nav data-scroll-nav>
    <div class="nav-container">
      <div class="logo">📦 Hyperion</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="investment.html">Investments</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="hero">
    <h1>Advanced Shipment Tracking</h1>
    <p>Real-time tracking with detailed logistics insights</p>
    <div class="search-group">
      <input type="text" id="trackingInput" aria-label="Tracking number" placeholder="Enter Tracking ID (e.g., HY-123456)" oninput="this.value = this.value.toUpperCase()">
      <button class="btn-search hx-press" onclick="track()">Track</button>
    </div>
  </div>

  <div class="results" id="results"></div>

  <script type="module">
    import { createTracker } from "./tracker/tracker.js";
    import { bindTrackingSession, consumeCodeFromUrl } from "./tracker/session.js";

    const input = document.getElementById("trackingInput");
    const button = document.querySelector(".btn-search");
    const tracker = createTracker(document.getElementById("results"), {
      onState: (s) => { if (button) button.disabled = s.phase === "loading"; }
    });

    // Public entry point kept for existing inline handlers (onclick="track()")
    window.track = (id) => tracker.track(id !== undefined ? id : input.value);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); window.track(); } });
    input.setAttribute("autocapitalize", "characters"); input.setAttribute("autocomplete", "off"); input.setAttribute("spellcheck", "false"); input.setAttribute("enterkeyhint", "search");

    // Temporary tracking session: code kept in memory only; cleared on reload, leave, back/forward restore and inactivity.
    bindTrackingSession({ tracker, input });
    // A ?code= link (e.g. admin "Open public page") is used once and removed from the address bar.
    const initial = consumeCodeFromUrl();
    if (initial) { input.value = initial.toUpperCase(); tracker.track(initial); }
  </script>

  <footer>
    <p>&copy; 2024 Hyperion Logistics. All rights reserved.</p>
  </footer>
</body>
</html>
