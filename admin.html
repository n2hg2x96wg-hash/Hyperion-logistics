<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperion Admin - Advanced Shipment Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      min-height: 100vh;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      color: #e2e8f0;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-footer {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.2);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      background: #22c55e;
      color: white;
      border-radius: 8px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .shipment-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 32px;
    }

    .tool-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 24px;
    }

    @media (max-width: 768px) {
      .form-footer { flex-direction: column; }
      .btn { width: 100%; }
      .toast { left: 20px; right: 20px; }
      .shipment-tools { grid-template-columns: 1fr; }
    }
  </style>
  <!-- Smartsupp Live Chat script -->
  <script type="text/javascript">
  var _smartsupp = _smartsupp || {};
  _smartsupp.key = '8d189e08256876f6e213e16802a6f5b15da26d5c';
  window.smartsupp||(function(d) {
    var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
    s=d.getElementsByTagName('script')[0];c=d.createElement('script');
    c.type='text/javascript';c.charset='utf-8';c.async=true;
    c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
  })(document);
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔧 Shipment Management</h1>
      <p>Create, update, and manage shipments</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
      <div>
        <h2 style="color: #e2e8f0; margin-bottom: 16px;">Create Shipment</h2>
        <div class="form-group">
          <label>Tracking ID</label>
          <input type="text" id="trackId" placeholder="TRACK001">
        </div>
        <div class="form-group">
          <label>Origin</label>
          <input type="text" id="origin" placeholder="New York">
        </div>
        <div class="form-group">
          <label>Destination</label>
          <input type="text" id="destination" placeholder="Los Angeles">
        </div>
        <div class="form-footer">
          <button class="btn btn-primary" onclick="createShipment()">Create Shipment</button>
        </div>
      </div>

      <div>
        <h2 style="color: #e2e8f0; margin-bottom: 16px;">Delete Shipment</h2>
        <div class="form-group">
          <label>Tracking ID to Delete</label>
          <input type="text" id="deleteId" placeholder="TRACK001">
        </div>
        <div class="form-footer">
          <button class="btn btn-secondary" onclick="deleteShipment()">Delete</button>
        </div>
      </div>
    </div>

    <div class="shipment-tools">
      <div class="tool-card">
        <h3 style="color: #e2e8f0; margin-bottom: 12px;">📊 Statistics</h3>
        <p style="color: #94a3b8;">View shipment analytics and trends</p>
      </div>
      <div class="tool-card">
        <h3 style="color: #e2e8f0; margin-bottom: 12px;">⚙️ Settings</h3>
        <p style="color: #94a3b8;">Configure tracking parameters</p>
      </div>
    </div>
  </div>

  <script>
    window.createShipment = async () => {
      const trackId = document.getElementById('trackId').value;
      const origin = document.getElementById('origin').value;
      const destination = document.getElementById('destination').value;

      if (!trackId || !origin || !destination) {
        alert('Please fill all fields');
        return;
      }

      try {
        const response = await fetch('/api/shipments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trackId, origin, destination })
        });
        if (response.ok) {
          showToast('Shipment created successfully!');
          document.getElementById('trackId').value = '';
          document.getElementById('origin').value = '';
          document.getElementById('destination').value = '';
        }
      } catch (err) {
        alert('Error creating shipment: ' + err.message);
      }
    };

    window.deleteShipment = async () => {
      const id = document.getElementById('deleteId').value;
      if (!id) {
        alert('Enter tracking ID');
        return;
      }
      try {
        await fetch(`/api/shipments/${id}`, { method: 'DELETE' });
        alert('Shipment deleted successfully!');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
